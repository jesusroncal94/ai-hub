[project]
name = "ai-hub"
version = "0.1.0"
description = "Lightweight multimodal AI chat interface powered by Claude Code"
readme = "README.md"
authors = [
    { name = "Jesus Roncal", email = "jesusroncal94@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "gradio>=5.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
voice = ["openai-whisper>=20240930"]

[project.scripts]
ai-hub = "ai_hub.app:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
